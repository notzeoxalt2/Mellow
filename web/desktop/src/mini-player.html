<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mellow Mini Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #ff5271;
      --accent-hover: #ff3357;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.07);
      --text-main: #181a22;
      --text-sub: #8d909c;
      --text-time: #9699a6;
      --track-bg: #e6e8ee;
      --btn-color: #1a1c22;
      --btn-hover: #000000;
      --btn-bg-hover: rgba(0, 0, 0, 0.05);
      --shadow: 0 20px 48px -10px rgba(0, 0, 0, 0.16), 0 0 0 1px rgba(0, 0, 0, 0.05);
    }
    html[data-theme="dark"] {
      --card-bg: #14161e;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f5f6f9;
      --text-sub: #9295a3;
      --text-time: #7e8290;
      --track-bg: rgba(255, 255, 255, 0.12);
      --btn-color: #f0f1f5;
      --btn-hover: #ffffff;
      --btn-bg-hover: rgba(255, 255, 255, 0.08);
      --shadow: 0 22px 54px -10px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.07);
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --card-bg: #14161e;
        --card-border: rgba(255, 255, 255, 0.08);
        --text-main: #f5f6f9;
        --text-sub: #9295a3;
        --text-time: #7e8290;
        --track-bg: rgba(255, 255, 255, 0.12);
        --btn-color: #f0f1f5;
        --btn-hover: #ffffff;
        --btn-bg-hover: rgba(255, 255, 255, 0.08);
        --shadow: 0 22px 54px -10px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.07);
      }
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: grid;
      place-items: center;
      padding: 5px;
    }
    .card {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
      -webkit-app-region: drag;
      cursor: grab;
      transition: background-color .24s ease, border-color .24s ease, box-shadow .24s ease;
    }
    .card:active { cursor: grabbing; }

    /* Left Artwork Section */
    .art-wrap {
      position: relative;
      width: 132px;
      height: 100%;
      flex-shrink: 0;
      overflow: hidden;
      background: #1c1e26;
      border-radius: 20px 0 0 20px;
      -webkit-app-region: no-drag;
      cursor: pointer;
    }
    .art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s ease;
    }
    .art-wrap:hover .art {
      transform: scale(1.03);
    }
    .art-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.22);
      opacity: 0;
      display: grid;
      place-items: center;
      color: #fff;
      transition: opacity .2s ease;
    }
    .art-wrap:hover .art-overlay {
      opacity: 1;
    }

    /* Right Details & Controls Section */
    .body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 13px 19px 12px 19px;
    }

    /* Top Row: Title + Heart on left, Window Actions on right */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .title-box {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
      -webkit-app-region: no-drag;
    }
    .title {
      font-size: 17.5px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.015em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }
    .heart-btn {
      flex-shrink: 0;
      background: transparent;
      border: 0;
      padding: 2px;
      color: var(--accent);
      cursor: pointer;
      display: grid;
      place-items: center;
      border-radius: 50%;
      transition: transform .18s cubic-bezier(0.34, 1.56, 0.64, 1), opacity .15s ease;
      -webkit-app-region: no-drag;
    }
    .heart-btn:hover {
      transform: scale(1.2);
    }
    .heart-btn:active {
      transform: scale(0.88);
    }
    .heart-pop {
      animation: heartPulse .32s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes heartPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    .window-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .action-btn {
      width: 25px;
      height: 25px;
      border: 0;
      background: transparent;
      color: var(--text-sub);
      display: grid;
      place-items: center;
      border-radius: 6px;
      cursor: pointer;
      transition: color .15s ease, background-color .15s ease, transform .15s ease;
    }
    .action-btn:hover {
      color: var(--text-main);
      background: var(--btn-bg-hover);
    }
    .action-btn:active {
      transform: scale(0.92);
    }

    /* Subtitle Row */
    .subtitle {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
      line-height: 1.2;
    }

    /* Scrubber Section */
    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 5px;
      margin-bottom: 2px;
      -webkit-app-region: no-drag;
    }
    .timestamps {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-time);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    .progress-bar-wrap {
      position: relative;
      width: 100%;
      height: 12px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .progress-slider {
      position: relative;
      width: 100%;
      height: 3.5px;
      appearance: none;
      -webkit-appearance: none;
      background: linear-gradient(to right, var(--accent) var(--progress, 0%), var(--track-bg) var(--progress, 0%));
      border-radius: 999px;
      border: 0;
      padding: 0;
      outline: none;
      cursor: pointer;
      transition: height .15s ease;
    }
    .progress-bar-wrap:hover .progress-slider {
      height: 5px;
    }
    .progress-slider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 9.5px;
      height: 9.5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.32);
      border: 1px solid rgba(0, 0, 0, 0.08);
      opacity: 0;
      transform: scale(0.7);
      transition: opacity .15s ease, transform .15s ease;
    }
    .progress-bar-wrap:hover .progress-slider::-webkit-slider-thumb {
      opacity: 1;
      transform: scale(1);
    }
    .progress-slider::-moz-range-thumb {
      width: 9.5px;
      height: 9.5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.32);
      border: 0;
      opacity: 0;
      transition: opacity .15s ease;
    }
    .progress-bar-wrap:hover .progress-slider::-moz-range-thumb {
      opacity: 1;
    }

    /* Bottom Row Controls */
    .controls-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      height: 34px;
      margin-top: 1px;
      -webkit-app-region: no-drag;
    }
    .vol-btn {
      width: 30px;
      height: 30px;
      border: 0;
      background: transparent;
      color: var(--btn-color);
      display: grid;
      place-items: center;
      border-radius: 50%;
      cursor: pointer;
      transition: color .15s ease, background-color .15s ease, transform .15s ease;
    }
    .vol-btn:hover {
      color: var(--btn-hover);
      background: var(--btn-bg-hover);
    }
    .vol-btn:active {
      transform: scale(0.9);
    }

    .transport-group {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .ctrl-btn {
      width: 32px;
      height: 32px;
      border: 0;
      background: transparent;
      color: var(--btn-color);
      display: grid;
      place-items: center;
      border-radius: 50%;
      cursor: pointer;
      transition: color .15s ease, background-color .15s ease, transform .15s ease;
    }
    .ctrl-btn:hover {
      color: var(--btn-hover);
      background: var(--btn-bg-hover);
    }
    .ctrl-btn:active {
      transform: scale(0.9);
    }

    .play-btn {
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      color: var(--btn-color);
      display: grid;
      place-items: center;
      border-radius: 50%;
      cursor: pointer;
      transition: color .15s ease, background-color .15s ease, transform .15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .play-btn:hover {
      color: var(--btn-hover);
      background: var(--btn-bg-hover);
      transform: scale(1.08);
    }
    .play-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Mellow Mini Player">
    <!-- Left Full-Bleed Artwork -->
    <div id="artWrap" class="art-wrap" title="Click to open Mellow">
      <img id="artwork" class="art" src="icon.png" alt="Album Art">
      <div class="art-overlay">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </div>
    </div>

    <!-- Right Content & Transport -->
    <div class="body">
      <!-- Top Row: Title + Heart on left, Window Actions on right -->
      <div class="header">
        <div class="title-box">
          <span id="title" class="title">Mellow</span>
          <button id="heartBtn" class="heart-btn" title="Favorite" aria-label="Favorite">
            <svg id="heartIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </button>
        </div>
        <div class="window-actions">
          <button id="themeBtn" class="action-btn" title="Toggle Light / Dark mode" aria-label="Toggle theme">
            <svg id="themeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button id="restoreBtn" class="action-btn" title="Restore Mellow" aria-label="Open main window">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </button>
          <button id="closeBtn" class="action-btn" title="Close mini player" aria-label="Close">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Second Row: Subtitle (Album - Artist) -->
      <div id="subtitle" class="subtitle">Ready to play</div>

      <!-- Third Row: Scrubber & Timestamps -->
      <div class="progress-section">
        <div class="timestamps">
          <span id="elapsed">00:00</span>
          <span id="remaining">-0:00</span>
        </div>
        <div class="progress-bar-wrap">
          <input id="progress" class="progress-slider" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek in track">
        </div>
      </div>

      <!-- Bottom Row: Volume on left, Centered Transport Controls -->
      <div class="controls-row">
        <!-- Volume / Mute Button -->
        <button id="volBtn" class="vol-btn" title="Mute / Unmute" aria-label="Volume">
          <svg id="volIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg id="muteIcon" hidden width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <!-- Transport Controls -->
        <div class="transport-group">
          <!-- Previous Track -->
          <button id="prevBtn" class="ctrl-btn" title="Previous" aria-label="Previous track">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 5.5h2.4v13H6zm3.6 6.5 9 6.5V5.5z"/>
            </svg>
          </button>

          <!-- Play / Pause -->
          <button id="playBtn" class="play-btn" title="Play" aria-label="Play">
            <svg id="playIcon" width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="pauseIcon" hidden width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="3.8" height="16" rx="1.9"/>
              <rect x="14.2" y="4" width="3.8" height="16" rx="1.9"/>
            </svg>
          </button>

          <!-- Next Track -->
          <button id="nextBtn" class="ctrl-btn" title="Next" aria-label="Next track">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
              <path d="m5.4 18.5 9-6.5-9-6.5zm10.2-13H18v13h-2.4z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const mini = window.mellowMiniPlayer;
    const artwork = document.getElementById('artwork');
    const artWrap = document.getElementById('artWrap');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const playBtn = document.getElementById('playBtn');
    const progress = document.getElementById('progress');
    const elapsed = document.getElementById('elapsed');
    const remaining = document.getElementById('remaining');
    const volBtn = document.getElementById('volBtn');
    const volIcon = document.getElementById('volIcon');
    const muteIcon = document.getElementById('muteIcon');
    const heartBtn = document.getElementById('heartBtn');
    const heartIcon = document.getElementById('heartIcon');
    const themeBtn = document.getElementById('themeBtn');

    let seeking = false;
    let trackDuration = 0;
    let isMuted = false;
    let isFavorited = true; // Default coral filled heart like the mockup

    // Format timestamps: elapsed as '00:27', remaining as '-4:00'
    function formatElapsed(sec) {
      if (!Number.isFinite(sec) || sec < 0) return '00:00';
      const s = Math.floor(sec);
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
    }

    function formatRemaining(sec) {
      if (!Number.isFinite(sec) || sec < 0) return '-0:00';
      const s = Math.floor(sec);
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return `-${m}:${String(rem).padStart(2, '0')}`;
    }

    // Theme Toggle (Porcelain Light vs Obsidian Dark)
    const savedTheme = localStorage.getItem('mellow-mini-theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    themeBtn.onclick = () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('mellow-mini-theme', next);
    };

    // Controls
    document.getElementById('prevBtn').onclick = () => mini?.action('prev');
    document.getElementById('playBtn').onclick = () => mini?.action('togglePlay');
    document.getElementById('nextBtn').onclick = () => mini?.action('next');
    document.getElementById('restoreBtn').onclick = () => mini?.restore();
    document.getElementById('closeBtn').onclick = () => mini?.close();
    artWrap.onclick = () => mini?.restore();

    volBtn.onclick = () => {
      isMuted = !isMuted;
      mini?.action('toggleMute');
      volIcon.hidden = isMuted;
      muteIcon.hidden = !isMuted;
    };

    heartBtn.onclick = () => {
      isFavorited = !isFavorited;
      mini?.action('toggleFavorite');
      heartBtn.style.color = isFavorited ? 'var(--accent)' : 'var(--text-sub)';
      heartBtn.classList.remove('heart-pop');
      void heartBtn.offsetWidth; // trigger reflow
      heartBtn.classList.add('heart-pop');
    };

    // Scrubber
    progress.onpointerdown = () => { seeking = true; };
    progress.oninput = () => {
      const ratio = Number(progress.value) / 1000;
      progress.style.setProperty('--progress', `${ratio * 100}%`);
      if (trackDuration > 0) {
        const cur = ratio * trackDuration;
        elapsed.textContent = formatElapsed(cur);
        remaining.textContent = formatRemaining(Math.max(0, trackDuration - cur));
      }
    };
    progress.onchange = () => {
      mini?.seek(Number(progress.value) / 1000);
      seeking = false;
    };

    // State sync from Mellow
    mini?.onUpdate((state) => {
      title.textContent = state.title || 'Mellow';
      
      // Subtitle formatting: album - artist or artist
      if (state.album && state.artist) {
        subtitle.textContent = `${state.album} - ${state.artist}`;
      } else {
        subtitle.textContent = state.artist || 'Ready to play';
      }

      if (state.artworkUrl && artwork.src !== state.artworkUrl) {
        artwork.src = state.artworkUrl;
      }

      // Track duration and position
      trackDuration = Math.max(0, Number(state.durationSec) || 0);
      const position = Math.max(0, Math.min(trackDuration, Number(state.positionSec) || 0));

      if (!seeking) {
        progress.value = trackDuration > 0 ? String(Math.round((position / trackDuration) * 1000)) : '0';
        progress.style.setProperty('--progress', `${trackDuration > 0 ? (position / trackDuration) * 100 : 0}%`);
        progress.disabled = trackDuration <= 0;

        elapsed.textContent = formatElapsed(position);
        const rem = Math.max(0, trackDuration - position);
        remaining.textContent = formatRemaining(rem);
      }

      // Playback status
      const playing = state.status === 'playing' || state.status === 'buffering';
      playIcon.hidden = playing;
      pauseIcon.hidden = !playing;
      playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
      playBtn.title = playing ? 'Pause' : 'Play';

      // Accent color sync
      if (state.accent && /^#[0-9a-fA-F]{6}$/.test(state.accent)) {
        document.documentElement.style.setProperty('--accent', state.accent);
      }
    });
  </script>
</body>
</html>
