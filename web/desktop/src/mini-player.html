<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mellow Mini Player</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --accent: #c4b5fd;
      --muted: #a6a7b2;
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      padding: 6px;
      background: transparent;
      color: #f7f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .player {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      height: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: 58px minmax(72px, 1fr) auto;
      align-items: center;
      gap: 11px;
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.19);
      border-radius: 20px;
      background: linear-gradient(110deg, color-mix(in srgb, var(--accent) 8%, transparent), transparent 42%), linear-gradient(180deg, rgba(24,25,31,.76), rgba(12,13,18,.88));
      -webkit-backdrop-filter: blur(26px) saturate(1.5);
      backdrop-filter: blur(26px) saturate(1.5);
      box-shadow: 0 14px 34px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.10), inset 0 0 0 1px rgba(0,0,0,.18);
      -webkit-app-region: drag;
      cursor: grab;
      transition: border-color .24s ease, background-color .24s ease, box-shadow .24s ease;
    }
    .player:active { cursor: grabbing; }
    .player::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(100deg, rgba(12,13,18,.34), rgba(12,13,18,.56) 52%, rgba(12,13,18,.68));
      pointer-events: none;
    }
    .player > :not(.ambient-art) { position: relative; z-index: 1; }
    .ambient-art {
      position: absolute;
      z-index: -1;
      inset: -28px;
      width: calc(100% + 56px);
      height: calc(100% + 56px);
      object-fit: cover;
      filter: blur(24px) saturate(1.08) brightness(.58);
      opacity: .16;
      transform: scale(1.08);
      pointer-events: none;
      transition: opacity .24s ease;
    }
    .player[data-playing="true"] { border-color: color-mix(in srgb, var(--accent) 40%, rgba(255,255,255,.22)); }
    .player[data-playing="true"] .ambient-art { opacity: .24; }
    .player[data-playing="false"] .ambient-art { opacity: .08; }
    .player:hover { border-color: color-mix(in srgb, var(--accent) 48%, rgba(255,255,255,.28)); box-shadow: 0 16px 38px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.12); }
    .progress {
      position: absolute;
      z-index: 2;
      right: 13px;
      bottom: 0;
      left: 13px;
      width: calc(100% - 26px);
      height: 3px;
      padding: 0;
      appearance: none;
      border: 0;
      border-radius: 0 0 99px 99px;
      background: linear-gradient(to right, var(--accent) var(--progress, 0%), rgba(255,255,255,.2) var(--progress, 0%));
      opacity: .68;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: height .16s ease, opacity .16s ease;
    }
    .player:hover .progress, .progress:focus-visible { height: 6px; opacity: 1; }
    .progress::-webkit-slider-thumb {
      width: 9px;
      height: 9px;
      appearance: none;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,.38);
      opacity: 0;
      transition: opacity .16s ease;
    }
    .player:hover .progress::-webkit-slider-thumb, .progress:focus-visible::-webkit-slider-thumb { opacity: 1; }
    .progress::-moz-range-thumb {
      width: 8px;
      height: 8px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,.38);
      opacity: 0;
    }
    .player:hover .progress::-moz-range-thumb, .progress:focus-visible::-moz-range-thumb { opacity: 1; }
    .art {
      display: block;
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 11px;
      background: #282832;
      box-shadow: 0 3px 12px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.12);
      -webkit-app-region: no-drag;
      cursor: pointer;
    }
    .info { min-width: 0; display: grid; gap: 4px; padding-right: 34px; }
    .title, .artist { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .title { font-size: 13px; font-weight: 650; letter-spacing: -.015em; text-shadow: 0 1px 8px rgba(0,0,0,.45); }
    .artist { color: var(--muted); font-size: 11.5px; text-shadow: 0 1px 8px rgba(0,0,0,.45); }
    .transport, .window-actions { display: flex; align-items: center; -webkit-app-region: no-drag; }
    .transport { gap: 4px; }
    .player > .window-actions {
      position: absolute;
      z-index: 4;
      top: 5px;
      right: 7px;
      gap: 0;
    }
    button {
      width: 32px;
      height: 34px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #e7e7ec;
      background: transparent;
      cursor: pointer;
      transition: background-color .16s ease, color .16s ease, transform .16s ease;
    }
    button:hover { color: #fff; background: rgba(255,255,255,.10); }
    button:active { transform: scale(.92); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .play { width: 38px; height: 38px; color: #111218; background: #f4f4f7; }
    .play:hover { color: #000; background: #fff; }
    .window-actions button { width: 28px; height: 30px; color: #a9aab3; border-radius: 8px; }
    @media (max-width: 430px) {
      .player { grid-template-columns: 50px minmax(60px,1fr) auto; gap: 8px; padding: 8px; }
      .art { width: 50px; height: 50px; border-radius: 9px; }
      .transport { gap: 0; }
      .transport button { width: 30px; height: 32px; }
      .transport .play { width: 36px; height: 36px; }
      .window-actions button { width: 24px; height: 24px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="player" aria-label="Mellow mini player">
    <img id="ambientArt" class="ambient-art" alt="" aria-hidden="true" hidden>
    <img id="artwork" class="art" src="icon.png" alt="Album artwork">
    <div class="info">
      <div id="title" class="title">Mellow</div>
      <div id="artist" class="artist">Ready to play</div>
    </div>
    <div class="transport" aria-label="Playback controls">
      <button id="prevBtn" title="Previous" aria-label="Previous track">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="playBtn" class="play" title="Play" aria-label="Play">
        <svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" hidden width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
      </button>
      <button id="nextBtn" title="Next" aria-label="Next track">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="m6 18 8.5-6L6 6zm10-12v12h2V6z"/></svg>
      </button>
    </div>
    <div class="window-actions" aria-label="Window controls">
      <button id="restoreBtn" title="Open Mellow" aria-label="Open main window">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg>
      </button>
      <button id="closeBtn" title="Close mini player" aria-label="Close mini player">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m18 6-12 12M6 6l12 12"/></svg>
      </button>
    </div>
    <input id="progress" class="progress" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek in track">
  </main>
  <script>
    const mini = window.mellowMiniPlayer;
    const player = document.querySelector('.player');
    const artwork = document.getElementById('artwork');
    const ambientArt = document.getElementById('ambientArt');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progress = document.getElementById('progress');
    let seeking = false;
    document.getElementById('prevBtn').onclick = () => mini?.action('prev');
    document.getElementById('playBtn').onclick = () => mini?.action('togglePlay');
    document.getElementById('nextBtn').onclick = () => mini?.action('next');
    document.getElementById('restoreBtn').onclick = () => mini?.restore();
    document.getElementById('closeBtn').onclick = () => mini?.close();
    artwork.onclick = () => mini?.restore();
    progress.onpointerdown = () => { seeking = true; };
    progress.oninput = () => progress.style.setProperty('--progress', `${Number(progress.value) / 10}%`);
    progress.onchange = () => {
      mini?.seek(Number(progress.value) / 1000);
      seeking = false;
    };
    mini?.onUpdate((state) => {
      title.textContent = state.title || 'Mellow';
      artist.textContent = state.artist || 'Ready to play';
      if (state.artworkUrl && artwork.src !== state.artworkUrl) {
        artwork.src = state.artworkUrl;
        ambientArt.src = state.artworkUrl;
      }
      ambientArt.hidden = !state.artworkUrl;
      if (state.accent) document.documentElement.style.setProperty('--accent', state.accent);
      if (state.accentGlow) document.documentElement.style.setProperty('--accent-glow', state.accentGlow);
      const duration = Math.max(0, Number(state.durationSec) || 0);
      const position = Math.max(0, Math.min(duration, Number(state.positionSec) || 0));
      if (!seeking) {
        progress.value = duration > 0 ? String(Math.round(position / duration * 1000)) : '0';
        progress.style.setProperty('--progress', `${duration > 0 ? position / duration * 100 : 0}%`);
        progress.disabled = duration <= 0;
      }
      const playing = state.status === 'playing' || state.status === 'buffering';
      player.dataset.playing = String(playing);
      playIcon.hidden = playing;
      pauseIcon.hidden = !playing;
      document.getElementById('playBtn').setAttribute('aria-label', playing ? 'Pause' : 'Play');
      document.getElementById('playBtn').title = playing ? 'Pause' : 'Play';
    });
  </script>
</body>
</html>
