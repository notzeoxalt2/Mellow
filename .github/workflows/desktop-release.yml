name: Build & Release Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build Web App
        run: corepack pnpm --dir web/app build

      - name: Build Desktop Bundle
        run: node web/desktop/build.js

      - name: Package App
        run: node web/desktop/package.js

      - name: Build NSIS Installer
        run: |
          cd web
          node node_modules/.pnpm/electron-builder@25.1.8_blu_ae00ce4f9846f7f0563724f80e60a6fd/node_modules/electron-builder/cli.js --prepackaged release/Mellow-win32-x64 --config desktop/electron-builder.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            web/release/installer/Mellow-Setup-*.exe
            web/release/installer/Mellow-Setup-*.exe.blockmap
            web/release/installer/Mellow-win32-x64-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
